version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./biografias:/var/www/html/recursos/primaria/recursosedu/biografias:ro
      - ./fasciculos:/var/www/html/recursos/primaria/recursosedu/fasciculos:ro
      - ./juegos:/var/www/html/recursos/primaria/recursosedu/juegos:ro
      - ./modulos:/var/www/html/recursos/primaria/recursosedu/modulos:ro
      - ./relatos:/var/www/html/recursos/primaria/recursosedu/relatos:ro
      - ./videos:/var/www/html/recursos/primaria/recursosedu/videos:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
